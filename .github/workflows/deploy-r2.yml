name: Deploy to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'data/surveys/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.mjs'
      - 'deploy_r2.py'
      - 'database.py'
      - '.github/workflows/deploy-r2.yml'
  workflow_dispatch:

concurrency:
  group: r2-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 openpyxl

      - name: Deploy to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || 'da30eb228f7c6f596214e6d5e0bef68d' }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'thaidimaru' }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning title=R2 Deployment Skipped::Cloudflare R2 credentials (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) are not configured in repository secrets. Skipping R2 deployment."
            exit 0
          fi
          python deploy_r2.py \
            --key "$R2_ACCESS_KEY_ID" \
            --secret "$R2_SECRET_ACCESS_KEY" \
            --bucket "$R2_BUCKET" \
            --endpoint "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

